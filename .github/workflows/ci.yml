name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, build, test & generated assets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build the theme
        run: pnpm build

      # Unit tests, plus integration tests that build the playground and broken fixtures.
      - name: Test
        run: pnpm test

      # The playground is the reference site: it must build, including the bilingual check.
      - name: Build the playground
        run: pnpm docs:build

      # The committed assets must be exactly what the generator produces, on every OS.
      - name: Generated assets are up to date
        run: |
          pnpm gen
          git status --porcelain -- brand/out
          test -z "$(git status --porcelain -- brand/out)"
