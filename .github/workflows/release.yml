name: Release

# Publishes @openlinkos/vitepress-theme to npm when a v* tag is pushed. Publishing uses npm
# trusted publishing (OIDC), so no token is stored and provenance is attached automatically.
# The `npm` environment requires a maintainer's approval before the job runs.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Trusted publishing needs npm 11.5.1 or later
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, test and build
        run: |
          pnpm lint
          pnpm build
          pnpm test

      - name: The tag matches the package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./packages/vitepress-theme/package.json').version")"

      - name: Publish
        working-directory: packages/vitepress-theme
        run: npm publish --access public
